org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true

# The project lives on D:\ while the pub cache (plugin sources) lives on
# C:\ — Kotlin's incremental compiler tries to compute a relative path
# between files on two different Windows drive letters, which is
# impossible and crashes the build ("this and base files have different
# roots"). Disabling incremental Kotlin compilation avoids that path
# computation entirely; it costs a little build speed, not correctness.
kotlin.incremental=false
